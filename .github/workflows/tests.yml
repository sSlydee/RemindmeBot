name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 runs in production, 3.13 is the next target
        python-version: ['3.11', '3.13']
    env:
      # stored times must not depend on the machine timezone
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Bot/lib/recurrent
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        run: python -m unittest discover -s unit_tests -t . -p '*Test.py' -v
