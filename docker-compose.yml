# ./docker-compose.yml

networks:
  remindme-net:
    external: false

services:
  bot:
    build: .
    depends_on:
        - mongo
    container_name: reminderbot-discord
    volumes:
           - ./Bot:/code
           - ./logs:/code/logs
           - /usr/share/zoneinfo:/usr/share/zoneinfo
  
    stdin_open: true
    tty: true

    environment:
      - MONGO_CONN
      - MONGO_PORT
      - MONGO_ROOT_USER
      - MONGO_ROOT_PASS
      - BOT_TOKEN
      - LOG_LEVEL
      - UPTIME_KUMA_PUSH_URL

    restart: always
    networks:
      - remindme-net

  mongo:
    image: mongo:4
    container_name: reminderbot-mongo
    restart: always
    volumes:
        - ./data/db:/data/db
    ports:
        - 27018:27017
    expose:
        - 27017
    environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}

    networks:
      - remindme-net
